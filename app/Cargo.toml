[package]
name = "baatcheet"
version = "0.1.0"
edition = "2024"

[dependencies]
baatcheet-core = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
dioxus = { version = "0.7.10", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlElement", "Navigator", "Storage", "StorageManager", "Location",
  "HtmlAudioElement", "HtmlMediaElement", "HtmlInputElement", "Element",
  "Response", "Request", "RequestInit", "RequestCache",
  "Blob", "File", "FileList",
  "ServiceWorkerContainer",
] }
